name: CI

# Nothing ran on push before this, so a commit that does not compile reached
# production the moment it landed. Typecheck and build are the two things that
# would have caught every broken deploy in this project's history.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Nothing had ever been linted here — `next lint` offered to set ESLint
      # up and never had been, so 25k lines were written with only tsc
      # watching. The first run found ~700 lines of dead code and one real bug.
      - name: Lint
        run: npm run lint
      # The service worker is plain JS outside the bundle, so tsc and next
      # build never look at it. A routing mistake there is the one bug that can
      # strand every visitor on a stale build, so it gets its own check.
      - name: Service worker routing
        run: npm run test:sw
      - name: Build
        run: npm run build
